[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
upload_port = COM4
board_build.flash_size = 2MB
board_upload.flash_size = 2MB
; This dev board has no auto-reset (DTR/RTS) circuit, so enter download mode
; manually before uploading (hold BOOT, tap EN, release BOOT) and tell esptool
; not to reset the chip out of it.
upload_flags = --before=no_reset
build_flags =
    -std=gnu++17
    -DCONFIG_ESP_TASK_WDT_TIMEOUT_S=5

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
